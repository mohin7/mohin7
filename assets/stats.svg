<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="9+ years frontend and design engineering, 7+ years at AppsCode, idea to launch end to end">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="1200" height="150" rx="20" fill="#0F0E17"/>
  <rect x="0.5" y="0.5" width="1199" height="149" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g stroke="#FFFFFF" stroke-opacity="0.08"><path d="M400 30V120M800 30V120"/></g>

  <g class="sans" text-anchor="middle">
