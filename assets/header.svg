<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Mohin Uddin — Head of Design and Design Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B12"/>
      <stop offset="1" stop-color="#14121F"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.82" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glow1)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- eyebrow -->
  <g transform="translate(72 78)">
    <rect width="232" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="18" cy="15" r="4" fill="#5EEAD4"/>
    <text x="32" y="20" class="mono" font-size="13" fill="#C9C7D6" letter-spacing="0.5">Dhaka, Bangladesh · Since 2017</text>
  </g>

  <text x="70" y="182" class="sans" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">Mohin Uddin</text>
  <text x="72" y="226" class="sans" font-size="24" font-weight="500" fill="url(#accent)">Head of Design · Design Engineer</text>
  <text x="72" y="268" class="sans" font-size="18" fill="#A09DB2">I make complex products feel simple, and ship them as production-grade interfaces.</text>

  <text xml:space="preserve" x="72" y="322" class="mono" font-size="13" fill="#8E8AA3" letter-spacing="0.5">AppsCode<tspan fill="#4A4660">  /  </tspan>UXAtom<tspan fill="#4A4660">  /  </tspan>Design Systems<tspan fill="#4A4660">  /  </tspan>Vue · Nuxt</text>

  <!-- abstract atom mark -->
  <g transform="translate(980 190)" fill="none" stroke-width="1.5">
    <ellipse rx="120" ry="44" stroke="#A78BFA" stroke-opacity="0.55"/>
    <ellipse rx="120" ry="44" stroke="#A78BFA" stroke-opacity="0.35" transform="rotate(60)"/>
    <ellipse rx="120" ry="44" stroke="#5EEAD4" stroke-opacity="0.45" transform="rotate(120)"/>
    <circle r="14" fill="url(#accent)" stroke="none"/>
    <circle cx="120" cy="0" r="5" fill="#A78BFA" stroke="none"/>
    <circle cx="-60" cy="104" r="5" fill="#5EEAD4" stroke="none" transform="rotate(0)"/>
  </g>
</svg>
